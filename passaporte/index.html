<title>Passaporte do Luquinhas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel de embarque de aeroporto (mapa) + cartões de embarque em papel (slides e jogos). Visual único, sem tema claro/escuro. */
:root{
  color-scheme:dark;
  --night:#101B3D; --board:#1A2A57; --flap:#24386F; --line:#3A5196;
  --amber:#FFC53D; --coral:#FF6F59; --sky:#67C9FF; --mint:#43DDA0;
  --paper:#FFF8E7; --paper2:#F3E7CB; --ink:#16214A; --muted:#5B6488; --onboard:#D8E0FA;
  --okbg:#D2F6E6; --okink:#0B6245; --badbg:#FFDDD6; --badink:#A32A17;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Lexend","Trebuchet MS",Verdana,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--onboard);font-family:var(--body);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.wrap{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}

/* painel */
.flaps{display:flex;flex-wrap:wrap;gap:3px}
.flap{font-family:var(--display);color:var(--amber);background:var(--flap);width:clamp(27px,7.4vw,56px);height:clamp(38px,10vw,74px);display:grid;place-items:center;font-size:clamp(20px,6vw,44px);border-radius:4px;position:relative;box-shadow:inset 0 -2px 0 #0003}
.flap::after{content:"";position:absolute;inset:50% 0 auto;height:2px;background:var(--night)}
.flap.sp{background:none;box-shadow:none;width:clamp(8px,2vw,16px)}.flap.sp::after{display:none}
.flap{animation:flip .5s both;animation-delay:calc(var(--i)*35ms)}
@keyframes flip{from{transform:rotateX(85deg)}to{transform:none}}
.hero{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--board);padding:10px 12px;border-radius:6px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,32px);color:var(--amber);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.howto{background:var(--board);border-radius:6px;padding:0 14px}
.howto summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--amber)}
.howto ol{margin:0 0 14px;padding-left:20px;display:grid;gap:6px}
.line h2{font-family:var(--display);font-weight:400;font-size:clamp(17px,4vw,22px);color:#fff;margin:0;text-wrap:balance}
.line p{margin:0 0 8px;font-size:14px}
.rows{display:grid;gap:4px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--board);padding:11px 12px;border-radius:5px;min-height:58px}
.row:hover{background:var(--flap)}
.row .code{font-family:var(--mono);color:var(--sky);font-size:14px}
.row .dest{font-weight:700;color:#fff;min-width:0}
.row .dest small{display:block;font-weight:400;color:var(--onboard);font-size:13px}
.st{font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:3px;white-space:nowrap;color:var(--onboard);border:1px solid var(--line)}
.st.next{background:var(--amber);color:var(--night);border-color:var(--amber);font-weight:500;animation:blink 1.4s infinite}
.st.done{background:none;color:var(--mint);border-color:var(--mint)}
@keyframes blink{50%{opacity:.6}}
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.extra{background:var(--flap);border-radius:6px;padding:14px;text-align:left;min-height:88px;display:flex;flex-direction:column;gap:2px}
.extra.big{grid-column:1/-1;background:var(--coral);color:var(--night)}
.extra b{font-family:var(--display);font-weight:400;font-size:18px;color:#fff}
.extra.big b{color:var(--night);font-size:22px}
.extra span{font-size:14px}
.reset{font-size:13px;color:var(--onboard);text-decoration:underline;align-self:center;padding:8px}

/* barra da aula */
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--board)}
.top .ttl{flex:1;min-width:0;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font-family:var(--mono);font-weight:400;color:var(--sky);margin-right:6px}
.ico{min-height:40px;min-width:40px;padding:0 10px;border-radius:5px;background:var(--flap);color:#fff;font-size:14px;white-space:nowrap}
.ico[aria-pressed="false"]{opacity:.6}
.miles{font-family:var(--mono);color:var(--amber);font-size:14px;white-space:nowrap}
.bottom{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--board)}
.nav{min-height:46px;padding:0 16px;border-radius:6px;font-weight:700;background:var(--flap);color:#fff}
.nav.go{background:var(--amber);color:var(--night)}
.route{flex:1;min-width:0;height:24px;position:relative}
.route::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line)}
.plane{position:absolute;top:0;font-size:18px;line-height:24px;transform:translateX(-50%);transition:left .35s}

/* cartão */
.pass{background:var(--paper);color:var(--ink);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.stub{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 20px;border-bottom:2px dashed var(--paper2)}
.body{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.body h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,5.2vw,40px);line-height:1.1;margin:0;color:var(--ink);text-wrap:balance}
.body p{margin:0;max-width:62ch;font-size:clamp(17px,2.6vw,21px)}
.body ul.big{margin:0;padding-left:22px;display:grid;gap:8px;font-size:clamp(17px,2.6vw,21px)}
mark{background:var(--amber);color:var(--ink);padding:0 4px;border-radius:3px}
.note{background:var(--board);border-left:4px solid var(--amber);padding:10px 14px;border-radius:4px;font-size:15px}
.note b{color:var(--amber);font-family:var(--mono);font-weight:500;margin-right:6px}

.formula{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:7px;font-weight:700;font-size:clamp(18px,3.4vw,27px);color:var(--ink)}
.chip small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.04em}
.c-s{background:var(--sky)}.c-v{background:var(--coral)}.c-c{background:var(--mint)}.c-h{background:var(--amber)}.c-q{background:#D3B6FF}
.ex{display:grid;gap:6px}
.exrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:var(--paper2);padding:8px 12px 8px 8px;border-radius:7px;color:var(--ink)}
.exrow .sp{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:14px}
.exrow .en{font-weight:700;font-size:clamp(17px,2.8vw,22px)}
.exrow .pt{font-size:15px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:clamp(15px,2.4vw,19px)}
.tbl th{text-align:left;background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:400;font-size:13px;padding:7px 10px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--paper2)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--paper2);color:var(--ink);border-radius:8px;padding:10px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.card:hover{background:#ecdcb7}
.card .pic{font-size:34px;line-height:1.2}
.card .w{font-weight:700;font-size:20px;line-height:1.15}
.card .pr{font-family:var(--mono);font-size:13px;color:var(--muted)}
.card .tr{font-size:15px;font-weight:700;color:var(--okink);min-height:22px}
.card:not(.open) .tr{color:var(--muted);font-weight:400}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* jogo */
.score{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--paper2);padding:8px 12px;border-radius:7px}
.score b{font-family:var(--display);font-weight:400;font-size:22px}
.bar{height:8px;background:var(--paper2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);transition:width .3s}
.prompt{font-size:clamp(20px,3.6vw,30px);font-weight:700;line-height:1.25;text-wrap:balance}
.passage{background:var(--paper2);padding:12px 14px;border-radius:7px;font-size:17px;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{background:var(--ink);color:var(--paper);min-height:62px;padding:10px;border-radius:8px;font-weight:700;font-size:clamp(16px,2.8vw,21px);overflow-wrap:anywhere}
.opt.ok{background:var(--mint);color:var(--ink)}.opt.bad{background:var(--coral);color:var(--ink)}
.opt:disabled{opacity:1}.opt.dim{opacity:.4}
.slot{min-height:64px;background:var(--paper2);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot:empty::before{content:"Toque nas palavras na ordem certa";color:var(--muted);font-size:15px;padding-left:6px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{background:var(--ink);color:var(--paper);min-height:48px;min-width:44px;padding:0 14px;border-radius:7px;font-weight:700;font-size:clamp(17px,2.8vw,22px)}
.slot .tile{background:var(--sky);color:var(--ink)}
.tile.used{visibility:hidden}
.act{align-self:center;min-height:52px;padding:0 30px;border-radius:8px;font-weight:700;background:var(--coral);color:var(--ink);font-size:18px}
.ptline{font-size:clamp(19px,3.2vw,26px);font-weight:700}
.fb{padding:12px 14px;border-radius:8px;font-size:17px;display:grid;gap:8px}
.fb.ok{background:var(--okbg);color:var(--okink)}.fb.bad{background:var(--badbg);color:var(--badink)}
.fb .act{justify-self:end;background:var(--ink);color:var(--paper)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pair>div{display:grid;gap:6px;align-content:start}
.pairb{background:var(--paper2);color:var(--ink);min-height:54px;padding:6px 8px;border-radius:7px;font-weight:700;font-size:clamp(15px,2.6vw,19px);overflow-wrap:anywhere}
.pairb.sel{background:var(--amber)}.pairb.hit{background:var(--okbg);color:var(--okink);opacity:.65}.pairb.miss{background:var(--coral)}
.bigword{font-family:var(--display);font-size:clamp(34px,9vw,64px);text-align:center;line-height:1.1;overflow-wrap:anywhere}
.listen{align-self:center;width:112px;height:112px;border-radius:50%;background:var(--coral);color:var(--ink);font-weight:700;font-size:16px}
.link{align-self:center;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px}
.saybtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.saybtns .act.alt{background:var(--paper2)}

/* resultado */
.result{align-items:center;text-align:center}
.stamp{width:190px;height:190px;border:5px double var(--coral);color:var(--coral);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(-11deg);font-family:var(--display);font-size:20px;line-height:1.05;padding:18px;animation:stamp .4s both}
.stamp small{font-family:var(--mono);font-size:11px}
@keyframes stamp{from{transform:rotate(-11deg) scale(2.2);opacity:0}to{transform:rotate(-11deg) scale(1)}}
.stars{font-size:38px;color:var(--amber);letter-spacing:6px;-webkit-text-stroke:1px var(--ink)}
.grade{font-family:var(--display);font-size:72px;line-height:1}
.review{width:100%;text-align:left;display:grid;gap:6px}
.review div{background:var(--badbg);color:var(--badink);padding:8px 12px;border-radius:7px;font-size:15px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{width:36px;height:36px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--line)}
.mini span.on{border:2px solid var(--coral);color:var(--coral);transform:rotate(-8deg)}
.search{width:100%;background:var(--paper2);border:0;color:var(--ink);padding:12px;font:inherit;border-radius:7px}
.timer{height:14px;background:var(--paper2);border-radius:7px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--coral)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amber);color:var(--night);padding:10px 16px;border-radius:7px;font-size:15px;max-width:min(92vw,520px);z-index:9}
@media(max-width:520px){.hideS{display:none}.body{padding:16px}.stub{padding:10px 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:50px minmax(0,1fr) auto;gap:8px}.nav{padding:0 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 keys.forEach(k=>{const [pid,n]=k.split(":");const p=PHASES.find(x=>x.id===pid);if(!p)return;const g=p.slides.find(s=>s.t==="game");if(g&&g.items[n])items.push(Object.assign({},g.items[n],{_k:k}));});
 if(!items.length){S.errs={};save();return home();}
 const body=h("div",{cls:"body"},h("h1",null,"Revisar erros"));
 runGame(body,shuffle(items),{onRight(c){delete S.errs[c.it._k];save();}},()=>{sfx.win();home();toast("Revisão terminada.");});
 $app.replaceChildren(bar("Revisar erros"),h("main",{cls:"scroll"},h("div",{cls:"wrap"},h("article",{cls:"pass"},stubEl("Revisão",items.length+" questões"),body))));
}

/* dicionário */
function dict(){
 window.onkeydown=null;
 const all=pool().sort((a,b)=>a[1].localeCompare(b[1]));
 const list=h("div",{cls:"ex"});
 const draw=f=>{const v=f.trim().toLowerCase();list.replaceChildren(...all.filter(w=>!v||w[1].toLowerCase().includes(v)||w[3].toLowerCase().includes(v)).map(w=>h("button",{cls:"exrow",on:{click:()=>speak(w[1])}},h("span",{cls:"sp","aria-hidden":"true"},"▶"),h("span",null,h("div",{cls:"en"},w[1]+"  ",h("small",{style:"font-family:var(--mono);font-weight:400;color:var(--muted)"},"["+w[2]+"]")),h("div",{cls:"pt"},w[3])))));};
 const inp=h("input",{cls:"search",id:"busca",type:"search",placeholder:"Buscar em inglês ou português","aria-label":"Buscar palavra",on:{input:e=>draw(e.target.value)}});
 draw("");
 $app.replaceChildren(bar("Dicionário"),h("main",{cls:"scroll"},h("div",{cls:"wrap"},h("article",{cls:"pass"},stubEl("Dicionário",all.length+" palavras"),h("div",{cls:"body"},inp,list)))));
}
home();
</script>
